name: Compilar APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Preparar proyecto
        run: |
          flutter create --org com.luau --project-name luau_ide --platforms=android app
          unzip -o proyecto.zip -d overlay
          cp -rf overlay/. app/
          rm -rf app/test
          git clone --depth 1 https://github.com/luau-lang/luau app/native/luau
          G=app/android/app/build.gradle
          if [ -f "$G.kts" ]; then
            printf '\nandroid {\n    externalNativeBuild {\n        cmake {\n            path = file("../../native/CMakeLists.txt")\n        }\n    }\n}\n' >> "$G.kts"
          else
            printf '\nandroid {\n    externalNativeBuild {\n        cmake {\n            path "../../native/CMakeLists.txt"\n        }\n    }\n}\n' >> "$G"
          fi
      - name: Compilar
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: LuauIDE-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
